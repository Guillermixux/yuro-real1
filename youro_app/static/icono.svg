<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="gold" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#daa520" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fondo circular dorado -->
  <circle cx="256" cy="256" r="250" fill="url(#gold)" stroke="#8b6914" stroke-width="8"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#b8860b" stroke-width="4" opacity="0.5"/>
  <!-- Brillo -->
  <ellipse cx="200" cy="180" rx="120" ry="80" fill="url(#shine)"/>
  <!-- Símbolo Y central -->
  <text x="256" y="320" font-family="Arial,sans-serif" font-size="280" font-weight="bold"
        fill="#8b4513" text-anchor="middle" dominant-baseline="middle">Y</text>
  <!-- Símbolo Y con brillo -->
  <text x="256" y="316" font-family="Arial,sans-serif" font-size="280" font-weight="bold"
        fill="#daa520" text-anchor="middle" dominant-baseline="middle">Y</text>
</svg>
